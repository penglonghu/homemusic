server {
    listen 80;
    server_name _;  # 支持所有域名/IP访问
    root /usr/share/nginx/html;
    index index.html;

    # 添加权限策略头部，允许在非localhost环境下播放音频
    add_header Permissions-Policy "autoplay=(self)" always;

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 音频流代理 - 特殊处理音频请求（必须放在更通用的 /api 规则之前）
    location ~ ^/api/music/stream {
        proxy_pass https://homemusic-backend:8080;
        proxy_ssl_verify off;  # 不验证后端SSL证书（容器内通信）
        proxy_ssl_server_name on;  # 使用原始服务器名进行SSL握手
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 连接和超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 缓冲设置（重要：对于音频流）
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
        
        # 音频相关头部
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # 确保正确的Content-Type传递
        # 不要覆盖Content-Type，让后端决定
    }

    # 其他API代理（不包含音频流）
    location /api {
        proxy_pass https://homemusic-backend:8080;
        proxy_ssl_verify off;
        
        # 适配Go后端的代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 流式响应适配
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        
        # 处理CORS预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        
        # 常规CORS头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization" always;
    }
}